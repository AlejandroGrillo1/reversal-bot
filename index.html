<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10:30 Reversal Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  :root {
    --bg: #F3F5F2; --panel: #FFFFFF; --ink: #1D2B2A; --muted: #5E6B68;
    --rule: #D3DAD5; --gain: #2E7D4F; --gain-soft: #DCEFE2;
    --loss: #B8392B; --loss-soft: #F6DFDB; --idle: #E7EBE8; --accent: #2F5D8A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18222A; --panel: #1F2C35; --ink: #E6ECEA; --muted: #9AA8A5;
      --rule: #34444F; --gain: #5CC08A; --gain-soft: #1E3B2E;
      --loss: #E8806F; --loss-soft: #43272A; --idle: #2A3843; --accent: #7FA9D6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 48px 0 12px; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: .95rem; }
  .headline { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 500; line-height: 1.2; margin: 28px 0 8px; max-width: 30ch; }
  .pos { color: var(--gain); } .neg { color: var(--loss); }

  /* The scoreboard: tickers x models for the latest session */
  .board { display: grid; grid-template-columns: 64px repeat(3, 1fr); gap: 6px; margin-top: 24px; }
  .board .h { color: var(--muted); font-size: .85rem; padding: 0 4px; }
  .board .t { font-weight: 600; align-self: center; }
  .cell { background: var(--idle); border-radius: 6px; padding: 14px; min-height: 84px; }
  .cell.win { background: var(--gain-soft); } .cell.lose { background: var(--loss-soft); }
  .cell .big { font-size: 1.35rem; font-weight: 600; }
  .cell .small { font-size: .82rem; color: var(--muted); }
  .note { color: var(--muted); font-size: .9rem; margin-top: 10px; }

  .stats { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 8px; }
  .stats div span { display: block; color: var(--muted); font-size: .85rem; }
  .stats div strong { font-size: 1.25rem; font-weight: 600; }
  .chart-wrap { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; height: 320px; }

  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  .tag { font-size: .75rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .empty { padding: 28px; color: var(--muted); }
  label.toggle { font-size: .9rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>10:30 Reversal Bot</h1>
  <p class="sub">Paper trading SPY and QQQ options around 7:30 PT. Updates after each morning's run.</p>
  <label class="toggle"><input type="checkbox" id="showTest"> Include test runs</label>

  <p class="headline" id="headline">Loading results…</p>
  <p class="sub" id="sessionDate"></p>
  <div class="board" id="board"></div>
  <div id="dayNotes"></div>

  <h2>All time</h2>
  <div class="stats" id="stats"></div>

  <h2>Cumulative P&amp;L by model</h2>
  <div class="chart-wrap"><canvas id="chart" aria-label="Cumulative profit and loss by model"></canvas></div>

  <h2>Model scorecard</h2>
  <div class="table-wrap"><table id="scorecard"></table></div>

  <h2>Trade log</h2>
  <div class="table-wrap"><table id="log"></table></div>
</main>

<script>
const MODELS = { A: "+1% / −0.5%", B: "+2% / −1%", C: "+3% / −1.5%" };
const TICKERS = ["SPY", "QQQ"];
let raw = { trades: [], days: [] }, chart;

const usd = v => (v >= 0 ? "+$" : "−$") + Math.abs(v).toFixed(2);
const pct = v => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + "%";
const cls = v => v >= 0 ? "pos" : "neg";
const sum = a => a.reduce((s, x) => s + x, 0);

async function load() {
  try {
    const r = await fetch("data/results.json?t=" + Date.now());
    raw = await r.json();
  } catch (e) {
    document.getElementById("headline").textContent = "Couldn't load data/results.json. Check that the file exists in the repo.";
    return;
  }
  render();
}

function render() {
  const showTest = document.getElementById("showTest").checked;
  const trades = raw.trades.filter(t => showTest || !t.test);
  const days = raw.days.filter(d => showTest || !d.test);
  const dates = [...new Set(days.map(d => d.date))].sort();
  const latest = dates[dates.length - 1];

  // Latest session
  const hl = document.getElementById("headline");
  if (!latest) {
    hl.textContent = "No sessions yet. The bot runs each weekday at 7:25 PT.";
  } else {
    const today = trades.filter(t => t.date === latest);
    const total = sum(today.map(t => t.pnl_usd));
    hl.innerHTML = today.length
      ? `Latest session: <span class="${cls(total)}">${usd(total)}</span> across ${today.length} trades`
      : "Latest session: no trades. The setup didn't trigger.";
    document.getElementById("sessionDate").textContent = new Date(latest + "T12:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

    let html = `<div></div>` + Object.entries(MODELS).map(([m, d]) => `<div class="h">Model ${m}<br>${d}</div>`).join("");
    for (const tk of TICKERS) {
      html += `<div class="t">${tk}</div>`;
      for (const m of Object.keys(MODELS)) {
        const t = today.find(x => x.ticker === tk && x.model === m);
        html += t
          ? `<div class="cell ${t.pnl_usd >= 0 ? "win" : "lose"}"><div class="big ${cls(t.pnl_usd)}">${pct(t.pnl_pct)}</div><div class="small">${usd(t.pnl_usd)} · ${t.option} · ${t.reason}<br>${t.entry_time}–${t.exit_time} ET</div></div>`
          : `<div class="cell"><div class="small">No trade</div></div>`;
      }
    }
    document.getElementById("board").innerHTML = html;
    document.getElementById("dayNotes").innerHTML = days.filter(d => d.date === latest)
      .map(d => `<p class="note">${d.ticker}: ${d.note}</p>`).join("");
  }

  // All-time stats
  const wins = trades.filter(t => t.pnl_usd > 0).length;
  const tradedDays = new Set(trades.map(t => t.date)).size;
  const total = sum(trades.map(t => t.pnl_usd));
  document.getElementById("stats").innerHTML = [
    ["Total P&L", `<span class="${cls(total)}">${usd(total)}</span>`],
    ["Win rate", trades.length ? (100 * wins / trades.length).toFixed(0) + "%" : "–"],
    ["Trades", trades.length],
    ["Days run", dates.length],
    ["Days with a trade", tradedDays],
  ].map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join("");

  // Chart
  const palette = ["#2F5D8A", "#5B8FC4", "#9DBCE0", "#2E7D4F", "#5FAE7D", "#A4D4B4"];
  const tradeDates = [...new Set(trades.map(t => t.date))].sort();
  const datasets = [];
  TICKERS.forEach(tk => Object.keys(MODELS).forEach(m => {
    let run = 0;
    datasets.push({
      label: `${tk} ${m}`,
      data: tradeDates.map(d => (run += sum(trades.filter(t => t.date === d && t.ticker === tk && t.model === m).map(t => t.pnl_usd)))),
      borderColor: palette[datasets.length], backgroundColor: palette[datasets.length],
      tension: 0.2, pointRadius: 2, borderWidth: 2,
    });
  }));
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted");
  const rule = getComputedStyle(document.documentElement).getPropertyValue("--rule");
  if (chart) chart.destroy();
  if (window.Chart) {
    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: tradeDates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: muted, boxWidth: 12 } } },
        scales: {
          x: { ticks: { color: muted }, grid: { color: rule } },
          y: { ticks: { color: muted, callback: v => "$" + v }, grid: { color: rule } },
        },
      },
    });
  }

  // Scorecard
  let sc = `<tr><th>Model</th><th>Exit rule</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Avg return</th><th class="num">Total P&amp;L</th></tr>`;
  TICKERS.forEach(tk => Object.entries(MODELS).forEach(([m, d]) => {
    const ts = trades.filter(t => t.ticker === tk && t.model === m);
    const w = ts.filter(t => t.pnl_usd > 0).length;
    const p = sum(ts.map(t => t.pnl_usd));
    const avg = ts.length ? sum(ts.map(t => t.pnl_pct)) / ts.length : 0;
    sc += `<tr><td>${tk} ${m}</td><td>${d}</td><td class="num">${ts.length}</td><td class="num">${ts.length ? (100 * w / ts.length).toFixed(0) + "%" : "–"}</td><td class="num ${cls(avg)}">${ts.length ? pct(avg) : "–"}</td><td class="num ${cls(p)}">${ts.length ? usd(p) : "–"}</td></tr>`;
  }));
  document.getElementById("scorecard").innerHTML = sc;

  // Log
  const rows = [...trades].reverse();
  document.getElementById("log").innerHTML = rows.length
    ? `<tr><th>Date</th><th>Ticker</th><th>Model</th><th>Morning</th><th>Contract</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Return</th><th class="num">P&amp;L</th><th>Exit reason</th><th>Time (ET)</th></tr>` +
      rows.map(t => `<tr><td>${t.date}${t.test ? '<span class="tag">test</span>' : ""}</td><td>${t.ticker}</td><td>${t.model}</td><td>${t.morning}</td><td>${t.contract}</td><td class="num">${t.entry.toFixed(2)}</td><td class="num">${t.exit.toFixed(2)}</td><td class="num ${cls(t.pnl_pct)}">${pct(t.pnl_pct)}</td><td class="num ${cls(t.pnl_usd)}">${usd(t.pnl_usd)}</td><td>${t.reason}</td><td>${t.entry_time}–${t.exit_time}</td></tr>`).join("")
    : `<tr><td class="empty">No trades yet. They'll show up here after the first morning the setup triggers.</td></tr>`;
}

document.getElementById("showTest").addEventListener("change", render);
load();
</script>
</body>
</html>
