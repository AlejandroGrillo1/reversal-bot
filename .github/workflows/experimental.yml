name: Experimental

on:
  schedule:
    - cron: "20 20 * * 1-5"   # 4:20 PM New York time in summer (EDT): updates "this year" and RSI models
    - cron: "20 21 * * 1-5"   # 4:20 PM New York time in winter (EST)
  workflow_dispatch:
    inputs:
      which:
        description: "Which backtest to run"
        type: choice
        default: "this year"
        options:
          - "this year"
          - "RSI models"
          - "last 5 years"
          - "2022-23 round trip"
          - "everything"

permissions:
  contents: write

concurrency:
  group: experimental
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install alpaca-py
      - name: Run backtests
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          WHICH: ${{ github.event.inputs.which || 'daily' }}
        run: |
          if [ "$WHICH" = "this year" ] || [ "$WHICH" = "daily" ] || [ "$WHICH" = "everything" ]; then
            python experimental.py 2026-01-01 "" backtest_experimental.json
          fi
          if [ "$WHICH" = "RSI models" ] || [ "$WHICH" = "daily" ] || [ "$WHICH" = "everything" ]; then
            python rsi_models.py 2026-01-01
          fi
          if [ "$WHICH" = "last 5 years" ] || [ "$WHICH" = "everything" ]; then
            python experimental.py 2021-10-01 "" backtest_experimental_5y.json daily
          fi
          if [ "$WHICH" = "2022-23 round trip" ] || [ "$WHICH" = "everything" ]; then
            python experimental.py 2022-01-01 2023-12-29 backtest_experimental_down.json daily
          fi
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_experimental*.json
          if [ -f data/backtest_rsi.json ]; then git add data/backtest_rsi.json; fi
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Experimental: ${{ github.event.inputs.which || 'daily update' }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
