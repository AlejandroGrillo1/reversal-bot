name: Experimental

on:
  schedule:
    - cron: "20 20 * * 1-5"   # 4:20 PM New York time in summer (EDT)
    - cron: "20 21 * * 1-5"   # 4:20 PM New York time in winter (EST)
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-01-01"
        required: true

permissions:
  contents: write

concurrency:
  group: experimental
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install alpaca-py
      - name: Run experimental backtest
        run: python experimental.py "${{ github.event.inputs.start_date || '2026-01-01' }}"
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_experimental.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Experimental: update"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
