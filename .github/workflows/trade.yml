name: Daily paper trade

on:
  schedule:
    # Cron is in UTC. Two times cover daylight saving; the bot only runs
    # the one that lands between 9:30 and 10:25 ET (the other exits instantly).
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: trade right now, exit within 10 minutes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TEST_MODE: ${{ inputs.test_mode }}

      - name: Save results to repo
        if: always()
        run: |
          git config user.name "reversal-bot"
          git config user.email "reversal-bot@users.noreply.github.com"
          git add data/results.json
          git diff --staged --quiet || git commit -m "Results $(date -u +%F)"
          git push
