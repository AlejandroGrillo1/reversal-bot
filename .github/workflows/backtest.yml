name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD)"
        type: string
        default: "2026-01-02"
      end:
        description: "Last day (YYYY-MM-DD). Leave blank for yesterday"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          BT_START: ${{ inputs.start }}
          BT_END: ${{ inputs.end }}

      - name: Save results to repo
        run: |
          git config user.name "reversal-bot"
          git config user.email "reversal-bot@users.noreply.github.com"
          git add data/backtest.json data/backtest_levered.json data/backtest_levered_nohold.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Backtest ${{ inputs.start }} to ${{ inputs.end || 'yesterday' }}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push failed, retrying in 10s ($i/3)"; sleep 10
          done
          echo "Could not push results after 3 tries"; exit 1
